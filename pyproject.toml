[project]
name = "transferlens"
version = "0.1.0"
description = "Preflight review for a fictional non-ACAT cash transfer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transferlens*"]
